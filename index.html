<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Succès Donjons</title>
    <link rel="icon" type="image/png" href="/icon.png" />
  </head>
  <body>
    <!-- Affiché dans l'onglet quand l'outil est détaché dans la fenêtre flottante -->
    <div id="detached-notice" hidden>
      <p>L'outil est ouvert dans la fenêtre flottante.</p>
      <p class="hint">Garde cet onglet ouvert : le fermer ferme aussi la fenêtre flottante.</p>
      <button id="reattach-btn" type="button">Rattacher ici</button>
    </div>

    <div id="app">
      <header class="topbar">
        <h1>Succès Donjons</h1>
        <button id="pip-btn" type="button" class="icon-btn secondary"
          title="Détacher dans une fenêtre toujours au premier plan">⧉</button>
        <button id="pin-btn" type="button" class="icon-btn secondary pin-btn" hidden>📌</button>
        <button id="settings-btn" type="button" class="icon-btn secondary" title="Paramètres : mise à jour, sauvegarde">☰</button>
        <button id="avatar-btn" type="button" class="avatar-btn"></button>
      </header>
      <p id="pip-unsupported" class="warning" hidden>
        La fenêtre flottante nécessite Chrome ou Edge (version 116 ou plus récente).
      </p>
      <p id="pip-error" class="warning" hidden></p>

      <nav class="tabs">
        <button type="button" class="tab active" data-tab="main">🏰 Donjons</button>
        <button type="button" class="tab" data-tab="monsters">👾 Monstres</button>
      </nav>

      <!-- Vue principale : recherche et sommaire -->
      <div class="view" id="main-view">
        <div class="searchbar">
          <input id="search" type="search" placeholder="Rechercher un donjon ou un boss…" autocomplete="off" />
          <div class="global-stats" id="global-stats"></div>
        </div>
        <main class="content" id="summary">
          <p class="placeholder">Chargement des donjons…</p>
        </main>
      </div>

      <!-- Onglet Monstres : succès de la catégorie Monstres du jeu -->
      <div class="view" id="monsters-view" hidden>
        <p class="placeholder">Chargement des monstres…</p>
      </div>

      <!-- Écran de gestion des personnages, affiché à la place de la vue principale -->
      <div class="view" id="characters-view" hidden></div>

      <!-- Écran des paramètres : mise à jour des données, export/import -->
      <div class="view" id="settings-view" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
